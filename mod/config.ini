[menu]
title=第一人称

[field.enabled]
type=bool
label=启用第一人称模组
description=快捷键可在游戏原生「按键绑定」设置中自定义。
default=true

[field.fov]
type=number
label=视野大小
description=垂直视野角度（度）。
default=85
min=40
max=120
step=1

[field.sensitivity]
type=number
label=视角灵敏度
description=第一人称视角移动灵敏度倍率。
default=2
min=0.2
max=8
step=0.1

[field.height_variation]
type=bool
label=随动作变换高度
description=视线跟随角色的跑动与蹲伏动作上下起伏。
default=false

[field.head_translation]
type=bool
label=跟随头部位移
description=视线跟随角色的头部动作前后与左右晃动。
default=false

[field.head_rotation]
type=bool
label=跟随头部转动
description=视线跟随角色的头部动作旋转。
default=false

[field.head_tilt]
type=bool
label=跟随头部倾斜
description=视线跟随角色的头部侧倾动作。
default=false

[field.head_strength]
type=number
label=头部转动与倾斜幅度
description=头部动作转动与倾斜效果的强度倍率。
default=0.4
min=0
max=1
step=0.05

[field.eye_offset]
type=number
label=眼睛高度偏移
description=相对头部骨骼高度的上下微调（米）。
default=0.08
min=-0.2
max=0.3
step=0.01

[field.forward_offset]
type=number
label=视点前移
description=视点相对头部中心的前移距离（米）。
default=0.08
min=0
max=0.3
step=0.01

[field.smoothing]
type=number
label=头部跟随平滑度
description=平滑动画位移（秒），0 为直接跟随。
default=0.08
min=0
max=0.4
step=0.01

[field.turn_speed]
type=number
label=超过 90 度时转身速度
description=视线与角色朝向夹角超过 90 度后，角色平滑转向视线的速度（度/秒）。
default=360
min=90
max=1080
step=30

[field.hide_self]
type=bool
label=隐藏头部模型
description=进入第一人称时隐藏头部和头发模型，避免遮挡视线。
default=true

[field.show_body]
type=bool
label=低头可见身体
description=低头时可见躯干与四肢，关闭后隐藏全部身体模型。
default=true

[field.fun_effects]
type=bool
label=角色趣味视野
description=总开关，为特定角色启用专属第一人称视觉效果。
default=false

[field.tangtang_patch]
type=bool
label=汤汤 · 眼罩
description=左侧视野圆弧形眼罩遮挡效果。
default=true

[field.endmin_scan]
type=bool
label=管理员 · 抑制器扫描
description=周期性地形扫描波纹与光带视觉效果。
default=true

[field.scan_period]
type=number
label=扫描周期
description=扫描波纹的循环周期（秒）。
default=3
min=1
max=10
step=0.25

[field.dapan_sunglasses]
type=bool
label=大潘 · 墨镜
description=墨镜滤镜调暗画面。
default=true

[field.sunglasses_darkness]
type=number
label=墨镜深度
description=墨镜滤镜暗化深度。
default=0.35
min=0.05
max=0.75
step=0.05
